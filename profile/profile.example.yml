  avoid: [10+ years, staff, principal, unpaid, intern]
  min_ctc_lpa: 12   # 1L/month
  remote_ok: true
companies:   # ATS boards to scan (slug from the careers URL)
  greenhouse: [anthropic, vercel]
  lever: []
  ashby: [openai, replit]
international:
  # Countries paying more. Roles needing the local language are dropped automatically.
  countries: [Japan, Germany, Netherlands, Singapore, UAE, Remote]
  use_arbeitnow: true
  boards:           # listing pages; any language, translated automatically (verify each URL opens)
    - https://japan-dev.com/jobs
    - https://tokyodev.com/jobs
filters:
  max_years: 2        # drop postings whose text asks for more than this many years (not listed = kept)
  max_age_days: 21    # drop stale postings
  remote_only: true   # overseas jobs must be remote and open to India; no visa/relocation route
